services:
  - type: web
    name: betweenus-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - fromGroup: betweenus-shared
      - key: MONGODB_URI
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_API_BASE_URL
        value: https://app.backboard.io/api
      - key: BACKBOARD_TIMEOUT_MS
        value: "30000"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_TIMEOUT_MS
        value: "60000"
      - key: ELEVENLABS_MONTHLY_SECONDS
        value: "3600"
      - key: ELEVENLABS_MONTHLY_REQUESTS
        value: "60"
      - key: ELEVENLABS_TRANSCRIPTION_ENABLED
        value: "true"
      - key: ELEVENLABS_STORY_AUDIO_ENABLED
        value: "true"
      - key: ELEVENLABS_STORY_AUDIO_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_STORY_AUDIO_MONTHLY_LIMIT
        value: "10"
      - key: ELEVENLABS_STORY_AUDIO_TIMEOUT_MS
        value: "180000"
      - key: OLLAMA_HOST
        fromService:
          type: pserv
          name: betweenus-gemma
          property: hostport
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

  - type: worker
    name: betweenus-background-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - fromGroup: betweenus-shared
      - key: MONGODB_URI
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_TIMEOUT_MS
        value: "60000"
      - key: ELEVENLABS_MONTHLY_SECONDS
        value: "3600"
      - key: ELEVENLABS_MONTHLY_REQUESTS
        value: "60"
      - key: ELEVENLABS_TRANSCRIPTION_ENABLED
        value: "true"
      - key: ELEVENLABS_STORY_AUDIO_ENABLED
        value: "true"
      - key: ELEVENLABS_STORY_AUDIO_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_STORY_AUDIO_MONTHLY_LIMIT
        value: "10"
      - key: ELEVENLABS_STORY_AUDIO_TIMEOUT_MS
        value: "180000"
      - key: OLLAMA_HOST
        fromService:
          type: pserv
          name: betweenus-gemma
          property: hostport
      - key: SENTRY_DSN
        sync: false

  - type: pserv
    name: betweenus-gemma
    runtime: docker
    region: oregon
    plan: 4c-16g
    dockerfilePath: ./deploy/gemma/Dockerfile
    dockerContext: ./deploy/gemma
    autoDeploy: false
    disk:
      name: betweenus-gemma-models
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: GEMMA_MODEL
        value: gemma4:e2b
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_NO_CLOUD
        value: "1"
      - key: OLLAMA_CONTEXT_LENGTH
        value: "4096"
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: OLLAMA_KEEP_ALIVE
        value: 5m

envVarGroups:
  - name: betweenus-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: between_us
      - key: GEMMA_RUNTIME
        value: render
      - key: GEMMA_MODEL
        value: gemma4:e2b
      - key: GEMMA_TIMEOUT_MS
        value: "300000"
      - key: SENTRY_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SENTRY_ENABLED
        value: "true"
